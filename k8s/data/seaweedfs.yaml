# SeaweedFS (master + volume + filer + S3 gateway in one pod) in namespace "data".
# S3 credentials come from the Secret "seaweedfs-s3-config" (created by scripts/make_secrets.sh, never committed).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
  labels: {app: seaweedfs}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: seaweedfs}
  template:
    metadata:
      labels: {app: seaweedfs}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          command: ["/usr/bin/weed"]
          args:
            - "-logtostderr=true"
            - "server"
            - "-dir=/data"
            - "-ip.bind=0.0.0.0"
            - "-volume.max=100"
            - "-master.volumeSizeLimitMB=128"
            - "-s3"
            - "-s3.port=8333"
            - "-s3.config=/etc/seaweedfs/s3.json"
          ports:
            - {name: s3, containerPort: 8333}
          readinessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3config, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: seaweedfs-data}
        - name: s3config
          secret: {secretName: seaweedfs-s3-config}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: data
spec:
  type: NodePort
  selector: {app: seaweedfs}
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
      nodePort: 30833
