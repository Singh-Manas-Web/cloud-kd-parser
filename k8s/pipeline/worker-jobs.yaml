# Two teacher-labelling workers running at the same time, each with its own SHARD_INDEX.
# The prompt comes from the ConfigMap "teacher-prompt" (made from prompts/teacher_prompt.txt),
# S3 credentials from the Secret "s3-credentials". The teacher (Ollama) runs on the laptop.
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-worker-0
  namespace: pipeline
  labels: {app: teacher-worker}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {app: teacher-worker, shard: "0"}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: kd-worker:1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: SHARD_INDEX, value: "0"}
            - {name: SHARD_COUNT, value: "2"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: OLLAMA_URL, value: "http://host.k3d.internal:11434"}
            - {name: PROMPT_FILE, value: "/prompt/teacher_prompt.txt"}
          envFrom:
            - secretRef: {name: s3-credentials}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: prompt, mountPath: /prompt, readOnly: true}
      volumes:
        - name: prompt
          configMap: {name: teacher-prompt}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-worker-1
  namespace: pipeline
  labels: {app: teacher-worker}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {app: teacher-worker, shard: "1"}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: kd-worker:1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: SHARD_INDEX, value: "1"}
            - {name: SHARD_COUNT, value: "2"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: OLLAMA_URL, value: "http://host.k3d.internal:11434"}
            - {name: PROMPT_FILE, value: "/prompt/teacher_prompt.txt"}
          envFrom:
            - secretRef: {name: s3-credentials}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: prompt, mountPath: /prompt, readOnly: true}
      volumes:
        - name: prompt
          configMap: {name: teacher-prompt}
