apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  namespace: app
  labels: {app: parser}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # start the new Pod first ...
      maxUnavailable: 0    # ... and never drop below the current number of Ready Pods
  selector:
    matchLabels: {app: parser}
  template:
    metadata:
      labels: {app: parser}
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: parser
          image: kd-parser:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: MODEL_URI, value: "s3://models/v1/"}
            - {name: MODEL_VERSION, value: "v1"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: MAX_NEW_TOKENS, value: "64"}
            - {name: FAULT_INJECT, value: "0"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_SECRET_ACCESS_KEY}}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:            # 503 until the model is loaded -> no Service endpoint while loading
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:             # 200 while the process is alive
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:                 # let the Ingress stop sending traffic before the Pod shuts down
              exec: {command: ["sleep", "10"]}
