apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parser
  namespace: app
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: parser}
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}   # % of the CPU request (500m)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # default is 300 s; shortened so scale-down is visible in one test
